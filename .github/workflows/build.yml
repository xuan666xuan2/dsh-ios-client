name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode Project
        run: xcodegen generate
      
      - name: Create Fake Signing Certificate
        run: |
          # 创建自签名证书用于编译（TrollStore 不需要正确签名）
          CERT_NAME="iPhone Developer"
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          
          # 创建临时 keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          
          # 生成自签名证书
          openssl req -x509 -newkey rsa:2048 -keyout $RUNNER_TEMP/key.pem -out $RUNNER_TEMP/cert.pem -days 1 -nodes -subj "/CN=$CERT_NAME"
          
          # 创建 p12
          openssl pkcs12 -export -out $RUNNER_TEMP/cert.p12 -inkey $RUNNER_TEMP/key.pem -in $RUNNER_TEMP/cert.pem -password pass:
          
          # 导入到 keychain
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
          
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
      
      - name: Build App
        run: |
          xcodebuild \
            -project DSHClient.xcodeproj \
            -scheme DSHClient \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            build
          
          # 找到 .app 文件
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"
      
      - name: Package IPA
        run: |
          mkdir -p payload
          cp -r "$APP_PATH" payload/
          zip -r DSHClient.ipa payload/
          echo "IPA created: DSHClient.ipa"
          ls -la DSHClient.ipa
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHClient-iPA
          path: DSHClient.ipa
          retention-days: 30
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DSH Client v1.0.${{ github.run_number }}
          files: DSHClient.ipa
          body: |
            ## DSH Client iOS
            
            📱 DSH Go 风格 iOS 客户端
            
            ### 安装方法（TrollStore）
            1. 下载 `DSHClient.ipa`
            2. 通过 TrollStore 安装
            3. 打开 App，输入 DSH 服务器地址即可连接
            
            ### 功能
            - 连接 DSH 实例
            - 聊天对话
            - 流式响应
            - 多会话管理
            - 连接历史保存
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
