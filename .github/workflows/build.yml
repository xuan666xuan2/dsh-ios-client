name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: |
          ls -la /Applications/ | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select --reset
          xcodebuild -version
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode Project
        run: xcodegen generate
      
      - name: Build App (No Signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHClient.xcodeproj \
            -scheme DSHClient \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log
          
          BUILD_STATUS=$?
          echo "Build exit code: $BUILD_STATUS"
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ Build failed! Saving log..."
            cp build.log build-error.log
          fi
          
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"
      
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-error.log
          retention-days: 7
      
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DSHClient.ipa Payload/
          echo "IPA created: DSHClient.ipa"
          ls -la DSHClient.ipa
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHClient-iPA
          path: DSHClient.ipa
          retention-days: 30
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DSH Client v1.0.${{ github.run_number }}
          files: DSHClient.ipa
          body: |
            ## DSH Client iOS 📱
            
            DSH Go 风格 iOS 客户端
            
            ### 安装方法（TrollStore 巨魔）
            1. 下载 `DSHClient.ipa`
            2. 通过 TrollStore 安装
            3. 打开 App，输入 DSH 服务器地址即可连接
            
            ### 功能
            - 🔗 连接 DSH 实例
            - 💬 聊天对话
            - ⚡ 流式响应
            - 📋 多会话管理
            - 💾 连接历史保存
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
